<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Puzzle</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#171717;--muted:#a5a5a5;--accent:#f5f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px clamp(16px,4vw,44px) 14px;border-bottom:1px solid #262626;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(20px,3vw,29px);margin:0;letter-spacing:.04em}header p{color:var(--muted);margin:5px 0 0}
.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #555;background:#f4f4f4;color:#111;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#222;color:#fff}.btn:focus-visible{outline:2px solid white;outline-offset:3px}
main{padding:18px clamp(12px,3vw,32px) 35px;max-width:1600px;margin:auto}.statusrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;color:#c8c8c8}.progress{height:6px;background:#292929;border-radius:8px;overflow:hidden;flex:1;min-width:100px;max-width:300px}.progress span{height:100%;display:block;width:0;background:#eee;transition:width .2s}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:18px;align-items:start}
.boardwrap,.traywrap{background:var(--panel);border:1px solid #303030;border-radius:13px;padding:12px;min-width:0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:13px;color:#ddd}.sectionhead span{color:#888;font-weight:400}
.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:1px;background:#666;border:1px solid #555;touch-action:manipulation}
.slot{background:#0b0b0b;position:relative;min-width:0;min-height:0;overflow:hidden;outline-offset:-3px}.slot.over,.piece.over{outline:2px solid white;z-index:2}.slot.correct{box-shadow:inset 0 0 0 1px #4d805b}
.tile{width:100%;height:100%;display:block;object-fit:fill;cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none}.tile:active{cursor:grabbing}.tile.selected{outline:3px solid #f5d742;outline-offset:-3px;z-index:4}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-height:calc(100vh - 250px);min-height:180px;overflow:auto;padding:2px;align-content:start}
.piece{aspect-ratio:1/1;min-width:0;background:#090909;border:1px solid #383838;overflow:hidden;position:relative;cursor:grab;touch-action:manipulation}.piece .tile{pointer-events:none}.piece:focus-visible{outline:2px solid white}
.empty{background:#101010}.hint{font-size:12px;color:#999;margin:11px 1px 0}.toast{min-height:23px;color:#ddd;font-size:13px;margin-top:12px}
@media(max-width:850px){.workspace{grid-template-columns:1fr}.tray{grid-template-columns:repeat(10,minmax(0,1fr));max-height:32vh;min-height:100px}.boardwrap,.traywrap{padding:9px}}
@media(max-width:480px){header{padding-top:16px}.btn{padding:9px 11px}.tray{grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}.statusrow{font-size:13px}}
</style>
</head>
<body>
<header><div><h1>IMAGE PUZZLE</h1><p>Rebuild the image. 100 square-cut pieces, no puzzle tabs.</p></div>
<div class="controls"><button class="btn" id="shuffle">Shuffle</button><button class="btn secondary" id="toggle">Hide loose pieces</button></div></header>
<main>
<div class="statusrow"><span id="count">0 / 100 pieces in place</span><div class="progress" aria-label="Progresso"><span id="bar"></span></div><span id="moves">Moves: 0</span></div>
<div class="workspace">
<section class="boardwrap"><div class="sectionhead">BOARD <span>Drag pieces into position</span></div><div id="board" class="board" aria-label="100-slot board"></div><div class="hint">Tip: click a piece, then a board slot to place it — or click two occupied slots to swap their pieces.</div></section>
<section class="traywrap" id="traywrap"><div class="sectionhead">LOOSE PIECES <span id="left">100 pieces</span></div><div id="tray" class="tray" aria-label="Pieces fora do tabuleiro"></div><div class="toast" id="toast" role="status" aria-live="polite">Ready to play.</div></section>
</div>
</main>

const N=10,TOTAL=N*N;
const board=document.querySelector('#board'),tray=document.querySelector('#tray'),count=document.querySelector('#count'),bar=document.querySelector('#bar'),movesLabel=document.querySelector('#moves'),left=document.querySelector('#left'),toast=document.querySelector('#toast');
let image=new Image(), tiles=[], slots=Array(TOTAL).fill(null), selected=null, moves=0, showTray=true, dragFrom=null;
image.src=SOURCE;
image.onload=()=>{createTiles();shuffle();};
function createTiles(){
 tiles=[];
 for(let i=0;i<TOTAL;i++){
  const c=document.createElement('canvas');c.width=100;c.height=100;
  const ctx=c.getContext('2d'),x=(i%N)*image.naturalWidth/N,y=Math.floor(i/N)*image.naturalHeight/N;
  ctx.drawImage(image,x,y,image.naturalWidth/N,image.naturalHeight/N,0,0,100,100);
  const img=document.createElement('img');img.className='tile';img.alt=`Piece ${i+1}`;img.draggable=false;img.src=c.toDataURL('image/png');
  tiles.push({id:i,el:img});
 }
}
function makeSlot(i){
 const s=document.createElement('div');s.className='slot';s.dataset.index=i;s.setAttribute('role','button');s.setAttribute('aria-label',`Slot ${i+1}`);
 s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});
 s.addEventListener('dragleave',()=>s.classList.remove('over'));
 s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');if(dragFrom)moveTo(dragFrom,{type:'board',index:i});});
 s.addEventListener('click',()=>clickBoard(i));return s;
}
const slotEls=[];
for(let i=0;i<TOTAL;i++){let s=makeSlot(i);slotEls.push(s);board.appendChild(s);}
function makePiece(t){
 const p=document.createElement('div');p.className='piece';p.dataset.id=t.id;p.draggable=true;p.tabIndex=0;p.setAttribute('role','button');p.setAttribute('aria-label',`Selecionar peça ${t.id+1}`);
 p.appendChild(t.el);
 p.addEventListener('dragstart',e=>{dragFrom=findTileLocation(t.id);e.dataTransfer.setData('text/plain',String(t.id));});
 p.addEventListener('dragend',()=>{dragFrom=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
 p.addEventListener('click',()=>clickTile(t.id));
 p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clickTile(t.id)}});
 return p;
}
function findTileLocation(id){
 for(let i=0;i<TOTAL;i++)if(slots[i]===id)return {type:'board',index:i};
 return {type:'tray',id};
}
function render(){
 slotEls.forEach((s,i)=>{s.replaceChildren();s.classList.toggle('correct',slots[i]===i);if(slots[i]!==null)s.appendChild(tiles[slots[i]].el);});
 tray.replaceChildren();
 let loose=[];for(let i=0;i<TOTAL;i++)if(!slots.includes(i))loose.push(i);
 loose.forEach(id=>tray.appendChild(makePiece(tiles[id])));
 document.querySelectorAll('.tile').forEach(el=>el.classList.toggle('selected',Number(el.alt.replace('Piece ',' '))-1===selected));
 const correct=slots.reduce((n,id,i)=>n+(id===i?1:0),0);
 count.textContent=`${correct} / 100 pieces no lugar`;bar.style.width=correct+'%';movesLabel.textContent=`Moves: ${moves}`;left.textContent=`${loose.length} pieces`;
 if(correct===TOTAL){toast.textContent='Image complete! You did it!';}
}
function removeFrom(loc){
 if(loc.type==='board'){const id=slots[loc.index];slots[loc.index]=null;return id;}
 return loc.id;
}
function putAt(loc,id){
 if(loc.type==='board'){const displaced=slots[loc.index];slots[loc.index]=id;return displaced;}
 return loc.id;
}
function moveTo(from,to){
 if(!from)return;
 if(from.type==='board'&&to.type==='board'&&from.index===to.index)return;
 const id=from.type==='board'?slots[from.index]:from.id;
 if(id===null||id===undefined)return;
 const targetId=to.type==='board'?slots[to.index]:null;
 if(from.type==='board')slots[from.index]=null;
 if(to.type==='board')slots[to.index]=id;
 if(targetId!==null&&targetId!==undefined&&from.type==='board')slots[from.index]=targetId;
 else if(targetId!==null&&targetId!==undefined&&from.type==='tray')slots[to.index]=id;
 moves++;selected=null;render();
}
function clickTile(id){
 if(selected===null){selected=id;toast.textContent=`Piece ${id+1} selected. Choose a board slot or another piece.`;render();return;}
 if(selected===id){selected=null;render();return;}
 const a=findTileLocation(selected),b=findTileLocation(id);
 swapLocations(a,b);selected=null;render();
}
function swapLocations(a,b){
 if(a.type==='board'&&b.type==='board'){[slots[a.index],slots[b.index]]=[slots[b.index],slots[a.index]];}
 else if(a.type==='board'&&b.type==='tray'){slots[a.index]=b.id;}
 else if(a.type==='tray'&&b.type==='board'){slots[b.index]=a.id;}
 moves++;
}
function clickBoard(i){
 if(selected!==null){
  const from=findTileLocation(selected);
  moveTo(from,{type:'board',index:i});return;
 }
 if(slots[i]!==null){selected=slots[i];toast.textContent=`Piece ${selected+1} selected.`;render();}
}
function shuffle(){
 slots=Array(TOTAL).fill(null);let ids=Array.from({length:TOTAL},(_,i)=>i);
 for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
 // Coloca as 100 pieces em posições aleatórias; nenhuma fica escondida.
 ids.forEach((id,pos)=>{slots[pos]=id;});
 // Evita deixar a imagem já resolvida por acaso.
 if(slots.every((id,i)=>id===i)){[slots[0],slots[1]]=[slots[1],slots[0]];}
 moves=0;selected=null;render();toast.textContent='Pieces embaralhadas. Drag pieces to rearrange.';
}
document.querySelector('#shuffle').addEventListener('click',shuffle);
document.querySelector('#toggle').addEventListener('click',()=>{showTray=!showTray;document.querySelector('#traywrap').style.display=showTray?'block':'none';document.querySelector('#toggle').textContent=showTray?'Hide loose pieces':'Show loose pieces';});
</script>
